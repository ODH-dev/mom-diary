<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF3E6">
<meta name="color-scheme" content="light dark">
<title>엄마의 일기장</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%23FCE6DC%22/%3E%3Cpath fill=%22%23EE9A7E%22 d=%22M12 19s-6-3.7-7.7-7.4C3.2 9 4.8 6.2 7.6 6.2c1.7 0 2.9 1 4.4 2.6 1.5-1.6 2.7-2.6 4.4-2.6 2.8 0 4.4 2.8 3.3 5.4C18 15.3 12 19 12 19z%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="엄마 일기장">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 크림색 종이 위에 마스킹테이프로 붙인 일기장 한 장. 날짜는 손글씨 큰 숫자, 날씨·기분은 스티커 */
:root{
  --paper:#FBF3E6;      /* 바탕 종이 */
  --page:#FFFDF8;       /* 일기장 한 장 */
  --ink:#5B4534;        /* 갈색 연필 */
  --muted:#A08B78;
  --line:#EFE2CF;       /* 공책 줄 */
  --peach:#EE9A7E;      /* 말로 남기기 */
  --peach-soft:#FCE6DC;
  --butter:#F8E3A3;     /* 마스킹테이프 */
  --leaf:#7FA77A;
  --leaf-soft:#E6F0E2;
  --danger:#C9624E;
  --f-hand:"Gaegu","Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#2A221C; --page:#352B23; --ink:#F2E4D3; --muted:#B9A592; --line:#4A3D32;
  --peach:#F0A188; --peach-soft:#4A3229; --butter:#6B5A2E; --leaf:#9DC498; --leaf-soft:#2C3A2A; --danger:#EE8C78; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{font-size:calc(100% * var(--fs,1))}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:1.125rem;line-height:1.6;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere;
  background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:22px 22px}
.wrap{max-width:560px;margin:0 auto;padding-block:22px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:26px}

/* 표지 */
header{display:flex;align-items:center;gap:12px}
.cover-icon{flex:none;width:54px;height:54px;border-radius:50%;background:var(--peach-soft);display:grid;place-items:center}
.cover-icon svg{width:30px;height:30px;color:var(--peach)}
header h1{font-family:var(--f-hand);font-weight:700;font-size:2.3rem;line-height:1.1;margin:0}
header p{margin:0;color:var(--muted);font-size:.95rem}

/* 일기장 한 장 */
.page{position:relative;background:var(--page);border-radius:6px 6px 18px 18px;padding:30px clamp(14px,4vw,20px) 22px;
  box-shadow:0 1px 0 var(--line),0 10px 24px -14px rgba(91,69,52,.35);display:flex;flex-direction:column;gap:20px}
.page::before{content:"";position:absolute;top:-11px;left:50%;width:120px;height:24px;margin-left:-60px;background:var(--butter);
  opacity:.85;transform:rotate(-2deg);border-radius:2px}

.dateline{display:flex;align-items:flex-end;gap:12px}
.day-num{font-family:var(--f-hand);font-weight:700;font-size:4rem;line-height:.8;color:var(--peach)}
.day-meta{display:flex;flex-direction:column;line-height:1.25;padding-bottom:2px}
.day-meta b{font-family:var(--f-hand);font-size:1.5rem}
.day-meta span{color:var(--muted);font-size:.95rem}
.date-change{margin-left:auto;position:relative;font-size:.9rem;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap;flex:none}
.date-change input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}

/* 말로 남기기 */
.voice{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:4px}
.mic-big{position:relative;width:150px;height:150px;border-radius:50%;border:0;background:var(--peach);color:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--f-hand);font-weight:700;font-size:1.45rem;
  box-shadow:0 0 0 12px var(--peach-soft),0 12px 22px -10px rgba(238,154,126,.8)}
.mic-big svg{width:50px;height:50px}
.mic-big:active{transform:scale(.97)}
#micArea{display:flex;flex-direction:column;align-items:center;width:100%}
.voice-hint{margin:14px 0 0;color:var(--muted);font-size:.95rem;text-wrap:balance}
.mic-msg{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--peach-soft);color:var(--danger);font-size:.95rem;text-wrap:balance}
.rec-panel{display:flex;flex-direction:column;align-items:center;gap:14px}
.rec-ring{width:150px;height:150px;border-radius:50%;background:var(--peach-soft);display:grid;place-items:center;position:relative}
.rec-ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--peach);opacity:.6}
@media (prefers-reduced-motion:no-preference){.rec-ring::after{animation:breathe 1.6s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.12);opacity:.15}}}
.rec-time{font-family:var(--f-hand);font-weight:700;font-size:2.6rem;color:var(--peach);font-variant-numeric:tabular-nums}
.rec-label{color:var(--muted);font-size:1rem;margin-top:-6px}
.stop{font-family:var(--f-hand);font-weight:700;font-size:1.5rem;min-height:60px;padding:6px 34px;border-radius:999px;border:2px solid var(--peach);background:var(--page);color:var(--peach);cursor:pointer;display:flex;align-items:center;gap:10px}
.stop i{width:16px;height:16px;background:var(--peach);border-radius:4px;display:inline-block}
.clip{width:100%;background:var(--peach-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.clip-title{font-family:var(--f-hand);font-weight:700;font-size:1.3rem}
.clip audio{width:100%}
.clip-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* 공책 */
.prompt{margin:0 0 -8px;font-family:var(--f-hand);font-weight:700;font-size:1.6rem;color:var(--ink)}
header h1,.sec-title,.day-meta b{letter-spacing:-.02em}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.95rem}
.divider::before,.divider::after{content:"";flex:1;border-top:1px dashed var(--line)}
textarea{width:100%;min-height:170px;resize:vertical;font-family:var(--f-hand);font-size:1.5rem;line-height:2.4rem;color:var(--ink);
  border:0;border-radius:0;padding:2px 4px;background:transparent;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.4rem - 1px),var(--line) calc(2.4rem - 1px),var(--line) 2.4rem);
  background-attachment:local}
textarea::placeholder{color:var(--muted);font-family:var(--f-ui);font-size:1rem}
textarea:focus,textarea:focus-visible{outline:none;background-color:var(--peach-soft)}

/* 말로/글로 고르기 */
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:18px;background:var(--paper)}
.mode button{font-family:var(--f-hand);font-weight:700;font-size:clamp(1.05rem,4.6vw,1.3rem);white-space:nowrap;min-width:0;padding:0 6px;min-height:54px;border:0;border-radius:14px;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.mode button svg{width:20px;height:20px}
.mode button[aria-selected="true"]{background:var(--page);color:var(--ink);box-shadow:0 2px 8px -3px rgba(91,69,52,.35)}
.mode button[aria-selected="true"] svg{color:var(--peach)}
#panelVoice{padding-top:4px}

/* 스티커 */
.stickers{display:flex;flex-direction:column;gap:12px}
.st-row{display:flex;flex-direction:column;gap:4px}
.st-row .label{font-size:.9rem;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.chip{font-family:var(--f-ui);font-size:.85rem;min-width:0;min-height:64px;white-space:nowrap;padding:4px 6px;border-radius:16px;border:1.5px solid transparent;background:transparent;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.2}
.chip .em{font-size:1.6rem;line-height:1.2;filter:grayscale(.55);opacity:.75}
.chip[aria-pressed="true"]{background:var(--peach-soft);border-color:var(--peach);color:var(--ink);font-weight:700}
.chip[aria-pressed="true"] .em{filter:none;opacity:1;transform:rotate(-6deg) scale(1.08)}

.btn{font-family:var(--f-hand);font-weight:700;font-size:1.6rem;min-height:60px;padding:6px 22px;border-radius:16px;border:0;background:var(--ink);color:var(--page);cursor:pointer;flex:1 1 auto}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-family:var(--f-ui);font-weight:400;font-size:1rem;flex:0 0 auto}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.small{font-family:var(--f-ui);font-size:1rem;min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--page);color:var(--ink);cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
.toast{font-family:var(--f-hand);font-weight:700;font-size:1.35rem;min-height:1.6em;text-align:center}
.toast.ok{color:var(--leaf)} .toast.err{color:var(--danger)}

/* 지난 일기 */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-title{font-family:var(--f-hand);font-weight:700;font-size:1.7rem;margin:0}
.link{font-family:var(--f-ui);font-size:.95rem;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 4px;min-height:40px;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--danger)}
.notice{color:var(--muted);font-size:1rem;text-align:center;padding:26px 8px;font-family:var(--f-hand);font-size:1.3rem}
.month{font-family:var(--f-hand);font-weight:700;font-size:1.35rem;color:var(--muted);display:flex;align-items:center;gap:10px;margin-top:4px}
.month::after{content:"";flex:1;border-top:1px dashed var(--line)}
.feed{display:flex;flex-direction:column;gap:22px;margin-top:12px}
.entry{position:relative;background:var(--page);border-radius:6px 6px 16px 16px;padding:22px 20px 16px;min-width:0;
  box-shadow:0 8px 20px -14px rgba(91,69,52,.35);display:flex;flex-direction:column;gap:10px}
.entry::before{content:"";position:absolute;top:-9px;left:22px;width:70px;height:18px;background:var(--butter);opacity:.8;transform:rotate(-3deg);border-radius:2px}
.entry:nth-child(even)::before{left:auto;right:22px;transform:rotate(3deg);background:var(--peach-soft)}
.ehead{display:flex;align-items:center;gap:12px}
.e-day{font-family:var(--f-hand);font-weight:700;font-size:2.6rem;line-height:.9;color:var(--peach);min-width:1.4em;text-align:center}
.e-date{display:flex;flex-direction:column;line-height:1.2}
.e-date b{font-family:var(--f-hand);font-size:1.25rem}
.e-date span{font-size:.85rem;color:var(--muted)}
.e-st{margin-left:auto;display:flex;gap:2px;font-size:1.6rem}
.e-st span{display:inline-block;transform:rotate(-8deg)}
.e-st span+span{transform:rotate(6deg)}
.ebody{font-family:var(--f-hand);font-size:1.45rem;line-height:2.2rem;white-space:pre-wrap;overflow-wrap:anywhere;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.2rem - 1px),var(--line) calc(2.2rem - 1px),var(--line) 2.2rem)}
.play{align-self:flex-start;font-family:var(--f-hand);font-weight:700;font-size:1.3rem;min-height:50px;padding:4px 20px 4px 8px;border-radius:999px;border:0;background:var(--peach-soft);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px}
.play .pbtn{width:36px;height:36px;border-radius:50%;background:var(--peach);color:#fff;display:grid;place-items:center}
.play svg{width:16px;height:16px;margin-left:2px}
.entry audio{width:100%}
.emeta{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}

/* 아들들의 읽음 · 반응 · 답장 */
.social{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.reads{display:flex;gap:6px;flex-wrap:wrap}
.read-chip{font-size:.82rem;padding:2px 10px;border-radius:999px;background:var(--paper);color:var(--muted)}
.read-chip.on{background:var(--leaf-soft);color:var(--leaf);font-weight:700}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.react-tag{font-size:.9rem;padding:3px 10px;border-radius:999px;background:var(--peach-soft);color:var(--ink)}
.react-btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.react-btn{font-family:var(--f-ui);font-size:.82rem;min-height:56px;padding:4px 2px;border-radius:14px;border:1.5px solid var(--line);background:var(--page);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;white-space:nowrap;min-width:0}
.react-btn b{font-size:1.35rem;font-weight:400}
.react-btn[aria-pressed="true"]{background:var(--peach-soft);border-color:var(--peach);color:var(--ink);font-weight:700}
.bubbles{display:flex;flex-direction:column;gap:6px}
.bubble{align-self:flex-start;max-width:90%;background:var(--paper);border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:1rem;line-height:1.5;overflow-wrap:anywhere}
.bubble .who{display:block;font-size:.78rem;font-weight:700;color:var(--peach)}
.bubble .when{font-size:.72rem;color:var(--muted);margin-left:6px;font-weight:400}
.reply-form{display:flex;gap:8px}
.reply-form input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--page);color:var(--ink);min-height:46px}
.reply-form button{font-family:var(--f-hand);font-weight:700;font-size:1.2rem;border:0;border-radius:12px;background:var(--ink);color:var(--page);padding:0 16px;cursor:pointer;min-height:46px;white-space:nowrap}
.reply-form button:disabled{opacity:.55}
.news{background:var(--peach-soft);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.news b{font-family:var(--f-hand);font-size:1.35rem;color:var(--ink)}
.news span{font-size:.95rem;color:var(--ink)}
.me-link{font-size:.85rem}

/* 가족 비밀번호 */
.pin{text-align:center;align-items:stretch}
.pin .sec-title{font-size:1.8rem}
.pin-hint{margin:-14px 0 0;color:var(--muted);font-size:.95rem}
.pin input{font-family:var(--f-hand);font-size:2.4rem;letter-spacing:.5em;text-align:center;padding:8px;border:0;border-bottom:2px dashed var(--line);background:transparent;color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
.pin input:focus{outline:none;border-bottom-color:var(--peach)}

/* 책 표지: 비밀번호가 맞으면 표지가 넘어가며 펼쳐짐 */
.book{position:relative;perspective:1800px;margin-right:8px}
.book-pages{position:absolute;inset:0;border-radius:6px 14px 14px 6px;display:grid;place-items:center;
  background:var(--page) repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);
  box-shadow:4px 4px 0 -1px var(--page),4px 4px 0 0 var(--line),8px 8px 0 -1px var(--page),8px 8px 0 0 var(--line)}
.book-pages p{font-family:var(--f-hand);font-weight:700;font-size:1.5rem;color:var(--muted);margin:0;opacity:0;transition:opacity .4s ease .45s}
.book-cover{background:var(--cover);border-radius:6px 14px 14px 6px;padding-left:clamp(30px,8vw,40px);
  background-image:linear-gradient(90deg,var(--spine) 0 16px,rgba(0,0,0,.08) 16px 18px,transparent 18px);
  outline:2px dashed var(--stitch);outline-offset:-10px;
  transform-origin:left center;transform-style:preserve-3d;transition:transform 1.05s cubic-bezier(.55,.05,.25,1)}
.book-cover .sec-title{text-wrap:balance}
.book-cover{min-height:300px}
.greet{display:none;flex:1;flex-direction:column;justify-content:center;gap:20px}
.greet .sec-title{font-size:2.4rem}
/* 이미 로그인된 경우: 닫힌 표지만 잠깐 보여 주고 펼침 */
.book.auto .greet{display:flex}
.book.auto .ask-only,.book.auto input,.book.auto .btn,.book.auto .toast{display:none}
.book-cover .pin-hint{color:var(--ink);opacity:.7}
.book-cover input{border-bottom-color:var(--stitch)}
.cover-back{position:absolute;inset:0;border-radius:14px 6px 6px 14px;background:var(--cover-in);
  transform:rotateY(180deg) translateZ(1px);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.book.opening .book-cover{transform:rotateY(-178deg)}
.book.opening .book-pages p{opacity:1}
:root{--cover:#F4CDB9;--spine:#E6AE93;--stitch:rgba(255,255,255,.75);--cover-in:#F7E6D6}
@media (prefers-color-scheme:dark){:root{--cover:#5C3E31;--spine:#4A3127;--stitch:rgba(255,235,220,.3);--cover-in:#43352B}}
/* 펼친 뒤 내용이 살짝 떠오름 */
@media (prefers-reduced-motion:no-preference){
  .just-opened > section,.just-opened > .news{animation:rise .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
}

/* ---- 업그레이드: 글씨 크기 · 카톡 알리기 · 질문 · 엄마 답장 · 사진 · 홈 화면 ---- */
header{position:relative}
header>div:nth-child(2){min-width:0}
header h1{font-size:clamp(26px,8vw,37px)}
.fs-btn{margin-left:auto;flex:none;align-self:flex-start;min-width:44px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--page);color:var(--ink);cursor:pointer;font-family:var(--f-ui);font-size:15px;padding:0 9px;white-space:nowrap}
/* 큰 글씨에서도 날짜 숫자·요일이 쪼개지지 않게 */
.day-num,.e-day,.day-meta b,.e-date b,.day-meta span{white-space:nowrap}
.dateline{flex-wrap:wrap;row-gap:10px}
.day-num{flex:none}
.fs-btn b{font-size:1.2em;margin-left:1px}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));z-index:50;background:var(--page);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 12px 32px -10px rgba(91,69,52,.45);display:flex;flex-direction:column;gap:10px}
.sheet p{margin:0;font-family:var(--f-hand);font-weight:700;font-size:1.35rem;line-height:1.3}
.sheet small{color:var(--muted);font-size:.85rem}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .kakao{flex:1 1 auto;min-height:54px;border:0;border-radius:14px;background:#FEE500;color:#191919;font-family:var(--f-hand);font-weight:700;font-size:1.4rem;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .3s ease}@keyframes up{from{opacity:0;transform:translate(-50%,16px)}}}
.qbox{gap:14px}
.qbox .sec-title{font-size:1.5rem}
.qitem{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:var(--paper)}
.qitem .q{font-family:var(--f-hand);font-size:1.4rem;line-height:1.35}
.qitem .meta{font-size:.82rem;color:var(--muted)}
.qitem .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qstate{font-size:.85rem;color:var(--muted)}
.qstate.done{color:var(--leaf);font-weight:700}
.ask-form{display:flex;gap:8px}

  <!-- 가족: 비밀번호 -->

      <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-label="비밀번호">

<div class="sheet" id="sheet" hidden role="dialog" aria-label="카톡으로 알리기"><p id="sheetMsg"></p><small id="sheetSub">누르면 공유 창이 열려요. 카카오톡을 골라 보내면 돼요.</small><div class="row"><button type="button" class="kakao" id="sheetGo">카톡으로 알리기</button><button type="button" class="small" id="sheetNo">괜찮아요</button></div></div>

<script>
var MODE = 'family';  /* 누구세요?에서 엄마를 고르면 'mom' */
/* 저장은 구글 시트·드라이브(Apps Script)로 보냄 */
var API = 'https://script.google.com/macros/s/AKfycbwBN4vqze8nUU_T6rZX3fFUSTNwmNDfPSskkxuZPFpuGvWBOLtKqnDSv_jU2YW7ZN2YMw/exec';
function callApi(fn,args){ return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args,key:pin})})
  .then(function(r){ return r.json(); }).then(function(j){ if(!j.ok) throw new Error(j.error||'error'); return j.result; }); }
var google={script:{}}; Object.defineProperty(google.script,'run',{get:function(){
  var ok=function(){}, fail=function(){}; var p=new Proxy({},{get:function(_,name){
    if(name==='withSuccessHandler') return function(f){ ok=f; return p; };
    if(name==='withFailureHandler') return function(f){ fail=f; return p; };
    return function(){ callApi(name,[].slice.call(arguments)).then(function(r){ ok(r); },function(e){ fail(e); }); };
  }}); return p; }});
var WEATHER = ['맑음','구름','비','눈','바람'];
var MOOD = ['좋음','그럭저럭','피곤','속상','감사'];
var EMOJI = {'맑음':'☀️','구름':'⛅','비':'🌧️','눈':'⛄','바람':'🍃','좋음':'😊','그럭저럭':'🙂','피곤':'😪','속상':'😢','감사':'🥰'};
var DAYS = ['일','월','화','수','목','금','토'];
var MAX_REC_SEC = 600;
var SONS = ['동탁','동학'];
var REACTS = [['❤️','고마워요'],['😂','웃겨요'],['👍','좋아요'],['🥲','짠해요']];
var ME = load('who')||'';
var $ = function(id){ return document.getElementById(id); };
var sel = { weather:null, mood:null }, editingId = null, confirmId = null, entries = [], pin = '';
var clip = null, keptAudio = false, removeAudio = false;
var rec = null, recChunks = [], recTimer = null, recStart = 0;
var audioCache = {}, photoCache = {};
var SITE = location.origin + location.pathname;
var questions = [], answering = null;
var photo = null, keptPhoto = false, removePhoto = false;
var ASK_IDEAS = ['요즘 뭐 드세요?','오늘 제일 좋았던 일은?','요즘 무슨 생각 하세요?','제가 어릴 때 어땠어요?'];
var MOM_QUICK = ['고마워 ❤️','사랑해 우리 아들','밥 잘 챙겨 먹어','시간 될 때 전화 한번 해'];

function pad(n){ return (n<10?'0':'')+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parts(s){ var p=s.split('-').map(Number); return {y:p[0],m:p[1],d:p[2],w:DAYS[new Date(p[0],p[1]-1,p[2]).getDay()]}; }
function mmss(sec){ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+':'+pad(sec%60); }
function store(k,v){ try{ v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function toast(id,msg,kind){ var t=$(id); t.textContent=msg; t.className='toast '+(kind||''); if(kind==='ok') setTimeout(function(){ if(t.textContent===msg) t.textContent=''; },3500); }

/* ---------- 목소리 녹음 ---------- */
function canRecordHere(){
  var pp=document.permissionsPolicy||document.featurePolicy;
  try{ if(pp&&pp.allowsFeature&&!pp.allowsFeature('microphone')) return false; }catch(e){}
  return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
}
function showVoice(state){ $('micArea').hidden=state!=='idle'; $('recPanel').hidden=state!=='rec'; $('clipPanel').hidden=state!=='clip'; }
function startRecording(){
  if(!canRecordHere()){ $('audioFile').click(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    micMsg(''); recChunks=[];
    var types=['audio/webm;codecs=opus','audio/mp4','audio/webm'], mime='';
    for(var i=0;i<types.length;i++){ if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(types[i])){ mime=types[i]; break; } }
    rec = mime? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) recChunks.push(e.data); };
    rec.onstop=function(){
      clearInterval(recTimer); stream.getTracks().forEach(function(t){ t.stop(); }); releaseWake();
      var type=(rec.mimeType||'audio/webm').split(';')[0];
      setClip(new Blob(recChunks,{type:type}),type,'voice.'+(type.indexOf('mp4')>=0?'m4a':'webm'),(Date.now()-recStart)/1000);
    };
    rec.start(1000); recStart=Date.now(); $('recTime').textContent='0:00'; showVoice('rec'); keepAwake();
    recTimer=setInterval(function(){ var s=(Date.now()-recStart)/1000; $('recTime').textContent=mmss(s); if(s>=MAX_REC_SEC) stopRecording(); },500);
  }).catch(function(err){
    var n=err&&err.name;
    micMsg(n==='NotAllowedError'||n==='SecurityError' ? '마이크 사용이 막혀 있어요. 주소창 왼쪽 자물쇠(또는 ⓘ)를 눌러 마이크를 허용한 뒤 다시 눌러 주세요.'
         : n==='NotFoundError' ? '이 기기에서 마이크를 찾지 못했어요.' : '녹음을 시작하지 못했어요. 다시 눌러 주세요.');
  });
}
/* 폰에서 녹음한 webm은 길이 정보가 없어 재생 막대가 0:00으로 보임 → 끝으로 한 번 넘겨 길이를 알아낸 뒤 처음으로 */
function fixDuration(a,done){
  var fin=function(){ if(done){ var d=done; done=null; d(); } };
  a.addEventListener('loadedmetadata',function(){
    if(isFinite(a.duration)&&a.duration>0) return fin();
    var h=function(){ if(isFinite(a.duration)&&a.duration>0){ a.removeEventListener('durationchange',h); a.currentTime=0; fin(); } };
    a.addEventListener('durationchange',h); a.currentTime=1e7;
  },{once:true});
  setTimeout(fin,4000);
}
/* 녹음 중에는 화면이 꺼지지 않게. 다른 앱으로 넘어가면 거기까지 녹음된 걸 지켜 둠 */
var wake=null, recCut=false;
function keepAwake(){ try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ wake=w; }).catch(function(){}); }catch(e){} }
function releaseWake(){ try{ if(wake) wake.release(); }catch(e){} wake=null; }
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&rec&&rec.state==='recording'){ recCut=true; stopRecording(); }
});
function micMsg(t){ var m=$('micMsg'); m.textContent=t||''; m.hidden=!t; }
function stopRecording(){ if(rec&&rec.state!=='inactive') rec.stop(); }
function setClip(blob,mime,name,seconds){
  if(!blob||!blob.size){ toast('toast','소리가 담기지 않았어요. 다시 눌러 주세요.','err'); showVoice('idle'); return; }
  if(blob.size>25*1024*1024){ toast('toast','너무 길어요. 10분 안으로 다시 해 주세요.','err'); showVoice('idle'); return; }
  clip={blob:blob,mime:mime||blob.type||'audio/mp4',name:name||'voice.m4a'}; removeAudio=false;
  var a=$('clipAudio'); try{ if(a.src) URL.revokeObjectURL(a.src); }catch(e){}
  fixDuration(a); a.src=URL.createObjectURL(blob); a.hidden=false;
  $('clipTitle').textContent= recCut ? '화면을 벗어나서 녹음이 멈췄어요'+(seconds?' ('+mmss(seconds)+'까지 담김)':'')+'. 들어 보고 저장하거나 다시 녹음해 주세요.'
    : '목소리가 담겼어요'+(seconds?' ('+mmss(seconds)+')':'')+'. 들어 보고 저장해 주세요.';
  recCut=false;
  showVoice('clip');
}
function dropClip(){
  if(clip){ clip=null; } else if(keptAudio){ removeAudio=true; keptAudio=false; }
  var a=$('clipAudio'); try{ if(a.src) URL.revokeObjectURL(a.src); }catch(e){} a.removeAttribute('src');
  showVoice('idle');
}
function blobToBase64(blob){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result).split(',')[1]||''); }; r.onerror=rej; r.readAsDataURL(blob); }); }

/* ---------- 엄마: 쓰기 ---------- */
function chips(boxId,list,key){
  var box=$(boxId); box.innerHTML='';
  list.forEach(function(v){
    var b=document.createElement('button'); b.type='button'; b.className='chip';
    var em=document.createElement('span'); em.className='em'; em.textContent=EMOJI[v]; em.setAttribute('aria-hidden','true');
    b.appendChild(em); b.appendChild(document.createTextNode(v));
    b.setAttribute('aria-pressed', String(sel[key]===v));
    b.onclick=function(){ sel[key]= sel[key]===v?null:v; chips(boxId,list,key); saveDraft(); };
    box.appendChild(b);
  });
}
function setMode(m){
  var v=m!=='text';
  $('tabVoice').setAttribute('aria-selected',String(v)); $('tabText').setAttribute('aria-selected',String(!v));
  $('panelVoice').hidden=!v; $('panelText').hidden=v; store('mode',v?'voice':'text');
  if(!v) setTimeout(function(){ $('bodyInput').focus(); },50);
}
function refreshChips(){ chips('weatherChips',WEATHER,'weather'); chips('moodChips',MOOD,'mood'); }
function setDateLabel(){
  var v=$('dateInput').value||todayStr(), p=parts(v);
  $('dayNum').textContent=p.d; $('dayMeta').textContent=p.m+'월 '+p.w+'요일';
  $('dayToday').textContent= v===todayStr()?'오늘의 일기':p.y+'년, 지난 하루';
}
function saveDraft(){ if(editingId) return; store('draft', JSON.stringify({t:$('bodyInput').value,w:sel.weather,m:sel.mood})); }
function loadDraft(){ try{ var d=JSON.parse(load('draft')||'null'); if(d){ $('bodyInput').value=d.t||''; sel.weather=d.w||null; sel.mood=d.m||null; } }catch(e){} }
function resetComposer(){ setPhoto(null); keptPhoto=false; removePhoto=false; editingId=null; keptAudio=false; removeAudio=false; clip=null; $('bodyInput').value=''; sel={weather:null,mood:null}; $('dateInput').value=todayStr();
  $('saveBtn').textContent='일기 저장하기'; $('cancelBtn').hidden=true; dropClip(); clip=null; removeAudio=false; refreshChips(); setDateLabel(); }

function save(){
  var text=$('bodyInput').value.trim();
  if(rec&&rec.state==='recording'){ toast('toast','먼저 "다 했어요"를 눌러 주세요.','err'); return; }
  if(!text&&!clip&&!keptAudio&&!photo&&!keptPhoto){ toast('toast', $('panelVoice').hidden?'일기 내용을 적어 주세요.':'먼저 동그란 버튼을 눌러 목소리를 남겨 주세요.','err'); return; }
  var btn=$('saveBtn'); btn.disabled=true; btn.textContent= clip?'목소리 담는 중…':photo?'사진 담는 중…':'저장하는 중…';

  var quick=el('div','quick'); var row=el('form','row'); var inp=document.createElement('input'); inp.maxLength=300; inp.placeholder='아들들한테 한마디'; inp.setAttribute('aria-label','아들들한테 한마디');
  MOM_QUICK.forEach(function(t){ var b=el('button',null,t); b.type='button'; b.onclick=function(){ inp.value=t; inp.focus(); }; quick.appendChild(b); });
  var sb=el('button','send','보내기'); sb.type='submit';
  row.onsubmit=function(ev){ ev.preventDefault(); sendReply(e,inp,sb); };
  row.appendChild(inp); row.appendChild(sb); w.appendChild(quick); w.appendChild(row);
  return w;
}

/* ---------- 사진 ---------- */
function setPhoto(p){
  photo=p; removePhoto=false;
  if(p){ $('photoImg').src=p.url; $('photoTxt').textContent='사진이 같이 저장돼요'; $('photoPrev').hidden=false; }
  else { $('photoPrev').hidden=true; $('photoImg').removeAttribute('src'); }
}
function pickPhoto(file){
  var btn=$('photoBtn'); btn.disabled=true; btn.textContent='사진 준비하는 중…';
  shrinkImage(file).then(function(p){ btn.disabled=false; btn.textContent='📷 다른 사진으로 바꾸기'; setPhoto(p); })
    .catch(function(){ btn.disabled=false; btn.textContent='📷 사진 한 장 붙이기'; toast('toast','이 사진은 열 수 없어요. 다른 사진을 골라 주세요.','err'); });
}
/* 큰 사진은 긴 쪽 1600px로 줄여 JPEG로 (빨리 올라가고 시트·드라이브도 가볍게) */
function shrinkImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=1600, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ if(!b) return rej(); blobToBase64(b).then(function(d){ res({data:d,url:URL.createObjectURL(b)}); },rej); },'image/jpeg',0.85);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}
var photoQueue=[], photoBusy=0;
function fetchPhoto(id,cb){
  if(photoCache[id]) return cb(photoCache[id]);
  photoQueue.push([id,cb]); pumpPhotos();
}
function pumpPhotos(){
  while(photoBusy<2&&photoQueue.length){
    var job=photoQueue.shift(), id=job[0], cb=job[1];
    if(photoCache[id]){ cb(photoCache[id]); continue; }
    photoBusy++;
    (function(id,cb){
      google.script.run.withSuccessHandler(function(r){
        photoBusy--; var bin=atob(r.data), arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        photoCache[id]=URL.createObjectURL(new Blob([arr],{type:r.mime||'image/jpeg'})); cb(photoCache[id]); pumpPhotos();
      }).withFailureHandler(function(){ photoBusy--; cb(null); pumpPhotos(); }).getPhoto(id,pin);
    })(id,cb);
  }
}
function loadPhotos(){
  document.querySelectorAll('.photo[data-pid]').forEach(function(box){
    var id=box.getAttribute('data-pid');
    fetchPhoto(id,function(u){
      if(!box.isConnected) return;
      if(!u){ box.textContent='사진을 불러오지 못했어요. 새로고침해 주세요.'; return; }
      box.textContent=''; var im=document.createElement('img'); im.alt='엄마가 붙인 사진'; im.src=u; im.onclick=function(){ box.classList.toggle('big'); }; box.appendChild(im);
    });
  });
}

/* ---------- 글씨 크기 ---------- */
var FS=[1,1.15,1.3], FS_NAME=['보통','크게','아주 크게'];
function applyFs(i){ i=(+i||0)%FS.length; document.documentElement.style.setProperty('--fs',FS[i]); $('fsBtn').setAttribute('aria-label','글씨 크기: '+FS_NAME[i]+' (누르면 바뀜)'); $('fsBtn').title='글씨 크기: '+FS_NAME[i]; return i; }
var fsIdx=applyFs(load('fs')||0);

/* ---------- 홈 화면에 추가 (안드로이드 크롬) ---------- */
var installEvt=null;
window.addEventListener('beforeinstallprompt',function(ev){ ev.preventDefault(); installEvt=ev; showInstall(); });
window.addEventListener('appinstalled',function(){ installEvt=null; $('installBox').hidden=true; });
function showInstall(){
  var standalone=window.matchMedia&&matchMedia('(display-mode: standalone)').matches;
  $('installBox').hidden=!(installEvt&&!standalone&&!load('instNo')&&!$('listSec').hidden);
}

/* ---------- 가족: 비밀번호 ---------- */
function showPin(msg){ hideAll(); $('subtitle').textContent='엄마와 동탁이, 동학이의 일기장'; $('pinBox').hidden=false; if(msg) toast('pinToast',msg,'err'); $('pinInput').focus(); }
function showCover(){
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(still){ start(); return; }
  hideAll(); $('subtitle').textContent='엄마와 동탁이, 동학이의 일기장';
  var book=$('pinBox'); book.classList.add('auto'); book.hidden=false;
  setTimeout(function(){ openBook(function(){ book.classList.remove('auto'); start(); }); },700);
}
function openBook(done){
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(still){ done(); return; }
  var book=$('pinBox'); book.classList.add('opening');
  setTimeout(function(){
    book.classList.remove('opening'); done();
    var app=$('app'); app.classList.add('just-opened'); setTimeout(function(){ app.classList.remove('just-opened'); },700);
  },1150);
}
function tryPin(){
  var v=$('pinInput').value.trim(); if(!v) return;
  var btn=$('pinBtn'); btn.disabled=true;
  google.script.run.withSuccessHandler(function(res){
    btn.disabled=false;
    if(!res||!res.ok){ toast('pinToast','비밀번호가 맞지 않아요.','err'); return; }
    pin=v; store('pin',v); ME=res.who||''; store('who',ME); $('pinInput').blur();
    openBook(function(){ $('pinInput').value=''; start(); });
  }).withFailureHandler(function(){ btn.disabled=false; toast('pinToast','연결이 안 돼요. 다시 눌러 주세요.','err'); }).getAllForFamily(v);
}

/* ---------- 시작: 모두 같은 링크 → 각자 비밀번호 (비밀번호로 누구인지 알아봄) ---------- */
(function(){
  $('refreshBtn').onclick=loadList;
  $('meBtn').onclick=logout;
  $('fsBtn').onclick=function(){ fsIdx=applyFs(fsIdx+1); store('fs',String(fsIdx)); };
  $('installGo').onclick=function(){ if(!installEvt) return; installEvt.prompt(); installEvt.userChoice.then(function(){ installEvt=null; $('installBox').hidden=true; }); };
  $('installNo').onclick=function(){ store('instNo','1'); $('installBox').hidden=true; };
  $('pinBtn').onclick=tryPin; $('pinInput').onkeydown=function(ev){ if(ev.key==='Enter') tryPin(); };
  var saved=load('pin');
  if(saved&&ME){ pin=saved; showCover(); } else logout();
})();
</script>
