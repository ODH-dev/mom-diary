<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF3E6">
<meta name="color-scheme" content="light dark">
<title>엄마의 일기장</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%23FCE6DC%22/%3E%3Cpath fill=%22%23EE9A7E%22 d=%22M12 19s-6-3.7-7.7-7.4C3.2 9 4.8 6.2 7.6 6.2c1.7 0 2.9 1 4.4 2.6 1.5-1.6 2.7-2.6 4.4-2.6 2.8 0 4.4 2.8 3.3 5.4C18 15.3 12 19 12 19z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 크림색 종이 위에 마스킹테이프로 붙인 일기장 한 장. 날짜는 손글씨 큰 숫자, 날씨·기분은 스티커 */
:root{
  --paper:#FBF3E6;      /* 바탕 종이 */
  --page:#FFFDF8;       /* 일기장 한 장 */
  --ink:#5B4534;        /* 갈색 연필 */
  --muted:#A08B78;
  --line:#EFE2CF;       /* 공책 줄 */
  --peach:#EE9A7E;      /* 말로 남기기 */
  --peach-soft:#FCE6DC;
  --butter:#F8E3A3;     /* 마스킹테이프 */
  --leaf:#7FA77A;
  --leaf-soft:#E6F0E2;
  --danger:#C9624E;
  --f-hand:"Gaegu","Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#2A221C; --page:#352B23; --ink:#F2E4D3; --muted:#B9A592; --line:#4A3D32;
  --peach:#F0A188; --peach-soft:#4A3229; --butter:#6B5A2E; --leaf:#9DC498; --leaf-soft:#2C3A2A; --danger:#EE8C78; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere;
  background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:22px 22px}
.wrap{max-width:560px;margin:0 auto;padding-block:22px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:26px}

/* 표지 */
header{display:flex;align-items:center;gap:12px}
.cover-icon{flex:none;width:54px;height:54px;border-radius:50%;background:var(--peach-soft);display:grid;place-items:center}
.cover-icon svg{width:30px;height:30px;color:var(--peach)}
header h1{font-family:var(--f-hand);font-weight:700;font-size:2.3rem;line-height:1.1;margin:0}
header p{margin:0;color:var(--muted);font-size:.95rem}

/* 일기장 한 장 */
.page{position:relative;background:var(--page);border-radius:6px 6px 18px 18px;padding:30px clamp(14px,4vw,20px) 22px;
  box-shadow:0 1px 0 var(--line),0 10px 24px -14px rgba(91,69,52,.35);display:flex;flex-direction:column;gap:20px}
.page::before{content:"";position:absolute;top:-11px;left:50%;width:120px;height:24px;margin-left:-60px;background:var(--butter);
  opacity:.85;transform:rotate(-2deg);border-radius:2px}

.dateline{display:flex;align-items:flex-end;gap:12px}
.day-num{font-family:var(--f-hand);font-weight:700;font-size:4rem;line-height:.8;color:var(--peach)}
.day-meta{display:flex;flex-direction:column;line-height:1.25;padding-bottom:2px}
.day-meta b{font-family:var(--f-hand);font-size:1.5rem}
.day-meta span{color:var(--muted);font-size:.95rem}
.date-change{margin-left:auto;position:relative;font-size:.9rem;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap;flex:none}
.date-change input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}

/* 말로 남기기 */
.voice{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:4px}
.mic-big{position:relative;width:150px;height:150px;border-radius:50%;border:0;background:var(--peach);color:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--f-hand);font-weight:700;font-size:1.45rem;
  box-shadow:0 0 0 12px var(--peach-soft),0 12px 22px -10px rgba(238,154,126,.8)}
.mic-big svg{width:50px;height:50px}
.mic-big:active{transform:scale(.97)}
#micArea{display:flex;flex-direction:column;align-items:center;width:100%}
.voice-hint{margin:14px 0 0;color:var(--muted);font-size:.95rem;text-wrap:balance}
.mic-msg{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--peach-soft);color:var(--danger);font-size:.95rem;text-wrap:balance}
.rec-panel{display:flex;flex-direction:column;align-items:center;gap:14px}
.rec-ring{width:150px;height:150px;border-radius:50%;background:var(--peach-soft);display:grid;place-items:center;position:relative}
.rec-ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--peach);opacity:.6}
@media (prefers-reduced-motion:no-preference){.rec-ring::after{animation:breathe 1.6s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.12);opacity:.15}}}
.rec-time{font-family:var(--f-hand);font-weight:700;font-size:2.6rem;color:var(--peach);font-variant-numeric:tabular-nums}
.rec-label{color:var(--muted);font-size:1rem;margin-top:-6px}
.stop{font-family:var(--f-hand);font-weight:700;font-size:1.5rem;min-height:60px;padding:6px 34px;border-radius:999px;border:2px solid var(--peach);background:var(--page);color:var(--peach);cursor:pointer;display:flex;align-items:center;gap:10px}
.stop i{width:16px;height:16px;background:var(--peach);border-radius:4px;display:inline-block}
.clip{width:100%;background:var(--peach-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.clip-title{font-family:var(--f-hand);font-weight:700;font-size:1.3rem}
.clip audio{width:100%}
.clip-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* 공책 */
.prompt{margin:0 0 -8px;font-family:var(--f-hand);font-weight:700;font-size:1.6rem;color:var(--ink)}
header h1,.sec-title,.day-meta b{letter-spacing:-.02em}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.95rem}
.divider::before,.divider::after{content:"";flex:1;border-top:1px dashed var(--line)}
textarea{width:100%;min-height:170px;resize:vertical;font-family:var(--f-hand);font-size:1.5rem;line-height:2.4rem;color:var(--ink);
  border:0;border-radius:0;padding:2px 4px;background:transparent;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.4rem - 1px),var(--line) calc(2.4rem - 1px),var(--line) 2.4rem);
  background-attachment:local}
textarea::placeholder{color:var(--muted);font-family:var(--f-ui);font-size:1rem}
textarea:focus,textarea:focus-visible{outline:none;background-color:var(--peach-soft)}

/* 말로/글로 고르기 */
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:18px;background:var(--paper)}
.mode button{font-family:var(--f-hand);font-weight:700;font-size:clamp(1.05rem,4.6vw,1.3rem);white-space:nowrap;min-width:0;padding:0 6px;min-height:54px;border:0;border-radius:14px;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.mode button svg{width:20px;height:20px}
.mode button[aria-selected="true"]{background:var(--page);color:var(--ink);box-shadow:0 2px 8px -3px rgba(91,69,52,.35)}
.mode button[aria-selected="true"] svg{color:var(--peach)}
#panelVoice{padding-top:4px}

/* 스티커 */
.stickers{display:flex;flex-direction:column;gap:12px}
.st-row{display:flex;flex-direction:column;gap:4px}
.st-row .label{font-size:.9rem;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.chip{font-family:var(--f-ui);font-size:.85rem;min-width:0;min-height:64px;white-space:nowrap;padding:4px 6px;border-radius:16px;border:1.5px solid transparent;background:transparent;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.2}
.chip .em{font-size:1.6rem;line-height:1.2;filter:grayscale(.55);opacity:.75}
.chip[aria-pressed="true"]{background:var(--peach-soft);border-color:var(--peach);color:var(--ink);font-weight:700}
.chip[aria-pressed="true"] .em{filter:none;opacity:1;transform:rotate(-6deg) scale(1.08)}

.btn{font-family:var(--f-hand);font-weight:700;font-size:1.6rem;min-height:60px;padding:6px 22px;border-radius:16px;border:0;background:var(--ink);color:var(--page);cursor:pointer;flex:1 1 auto}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-family:var(--f-ui);font-weight:400;font-size:1rem;flex:0 0 auto}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.small{font-family:var(--f-ui);font-size:1rem;min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--page);color:var(--ink);cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
.toast{font-family:var(--f-hand);font-weight:700;font-size:1.35rem;min-height:1.6em;text-align:center}
.toast.ok{color:var(--leaf)} .toast.err{color:var(--danger)}

/* 지난 일기 */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-title{font-family:var(--f-hand);font-weight:700;font-size:1.7rem;margin:0}
.link{font-family:var(--f-ui);font-size:.95rem;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 4px;min-height:40px;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--danger)}
.notice{color:var(--muted);font-size:1rem;text-align:center;padding:26px 8px;font-family:var(--f-hand);font-size:1.3rem}
.month{font-family:var(--f-hand);font-weight:700;font-size:1.35rem;color:var(--muted);display:flex;align-items:center;gap:10px;margin-top:4px}
.month::after{content:"";flex:1;border-top:1px dashed var(--line)}
.feed{display:flex;flex-direction:column;gap:22px;margin-top:12px}
.entry{position:relative;background:var(--page);border-radius:6px 6px 16px 16px;padding:22px 20px 16px;min-width:0;
  box-shadow:0 8px 20px -14px rgba(91,69,52,.35);display:flex;flex-direction:column;gap:10px}
.entry::before{content:"";position:absolute;top:-9px;left:22px;width:70px;height:18px;background:var(--butter);opacity:.8;transform:rotate(-3deg);border-radius:2px}
.entry:nth-child(even)::before{left:auto;right:22px;transform:rotate(3deg);background:var(--peach-soft)}
.ehead{display:flex;align-items:center;gap:12px}
.e-day{font-family:var(--f-hand);font-weight:700;font-size:2.6rem;line-height:.9;color:var(--peach);min-width:1.4em;text-align:center}
.e-date{display:flex;flex-direction:column;line-height:1.2}
.e-date b{font-family:var(--f-hand);font-size:1.25rem}
.e-date span{font-size:.85rem;color:var(--muted)}
.e-st{margin-left:auto;display:flex;gap:2px;font-size:1.6rem}
.e-st span{display:inline-block;transform:rotate(-8deg)}
.e-st span+span{transform:rotate(6deg)}
.ebody{font-family:var(--f-hand);font-size:1.45rem;line-height:2.2rem;white-space:pre-wrap;overflow-wrap:anywhere;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.2rem - 1px),var(--line) calc(2.2rem - 1px),var(--line) 2.2rem)}
.play{align-self:flex-start;font-family:var(--f-hand);font-weight:700;font-size:1.3rem;min-height:50px;padding:4px 20px 4px 8px;border-radius:999px;border:0;background:var(--peach-soft);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px}
.play .pbtn{width:36px;height:36px;border-radius:50%;background:var(--peach);color:#fff;display:grid;place-items:center}
.play svg{width:16px;height:16px;margin-left:2px}
.entry audio{width:100%}
.emeta{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}

/* 아들들의 읽음 · 반응 · 답장 */
.social{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.reads{display:flex;gap:6px;flex-wrap:wrap}
.read-chip{font-size:.82rem;padding:2px 10px;border-radius:999px;background:var(--paper);color:var(--muted)}
.read-chip.on{background:var(--leaf-soft);color:var(--leaf);font-weight:700}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.react-tag{font-size:.9rem;padding:3px 10px;border-radius:999px;background:var(--peach-soft);color:var(--ink)}
.react-btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.react-btn{font-family:var(--f-ui);font-size:.82rem;min-height:56px;padding:4px 2px;border-radius:14px;border:1.5px solid var(--line);background:var(--page);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;white-space:nowrap;min-width:0}
.react-btn b{font-size:1.35rem;font-weight:400}
.react-btn[aria-pressed="true"]{background:var(--peach-soft);border-color:var(--peach);color:var(--ink);font-weight:700}
.bubbles{display:flex;flex-direction:column;gap:6px}
.bubble{align-self:flex-start;max-width:90%;background:var(--paper);border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:1rem;line-height:1.5;overflow-wrap:anywhere}
.bubble .who{display:block;font-size:.78rem;font-weight:700;color:var(--peach)}
.bubble .when{font-size:.72rem;color:var(--muted);margin-left:6px;font-weight:400}
.reply-form{display:flex;gap:8px}
.reply-form input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--page);color:var(--ink);min-height:46px}
.reply-form button{font-family:var(--f-hand);font-weight:700;font-size:1.2rem;border:0;border-radius:12px;background:var(--ink);color:var(--page);padding:0 16px;cursor:pointer;min-height:46px;white-space:nowrap}
.reply-form button:disabled{opacity:.55}
.news{background:var(--peach-soft);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.news b{font-family:var(--f-hand);font-size:1.35rem;color:var(--ink)}
.news span{font-size:.95rem;color:var(--ink)}
.me-link{font-size:.85rem}

/* 가족 비밀번호 */
.pin{text-align:center;align-items:stretch}
.pin .sec-title{font-size:1.8rem}
.pin-hint{margin:-14px 0 0;color:var(--muted);font-size:.95rem}
.pin input{font-family:var(--f-hand);font-size:2.4rem;letter-spacing:.5em;text-align:center;padding:8px;border:0;border-bottom:2px dashed var(--line);background:transparent;color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
.pin input:focus{outline:none;border-bottom-color:var(--peach)}
</style>
</head>
<body>
<div class="wrap" id="app" data-mode="mom">
  <header>
    <div class="cover-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2.1 0 3.6 1.2 5.4 3.2C13.8 6.2 15.3 5 17.4 5 21 5 23 8.6 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg>
    </div>
    <div>
      <h1>엄마의 일기장</h1>
      <p id="subtitle"></p>
    </div>
  </header>

  <div class="news" id="news" hidden role="status"></div>

  <!-- 엄마: 쓰기 -->
  <section class="page" id="composer" hidden aria-label="일기 남기기">
    <div class="dateline">
      <span class="day-num" id="dayNum">8</span>
      <span class="day-meta"><b id="dayMeta">11월 일요일</b><span id="dayToday">오늘</span></span>
      <label class="date-change">날짜 바꾸기<input type="date" id="dateInput" aria-label="날짜 바꾸기"></label>
    </div>

    <p class="prompt">오늘 하루는 어땠어요?</p>
    <div class="mode" role="tablist" aria-label="남기는 방법">
      <button type="button" role="tab" id="tabVoice" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>말로 남기기</button>
      <button type="button" role="tab" id="tabText" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>글로 쓰기</button>
    </div>

    <div id="panelVoice" role="tabpanel">
    <div class="voice">
      <div id="micArea">
        <button class="mic-big" id="micBtn" type="button" aria-label="말로 남기기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
          <span>말로 남기기</span>
        </button>
        <p class="voice-hint">엄마 목소리 그대로 동탁이, 동학이에게 전해져요</p>
        <p class="mic-msg" id="micMsg" role="status" hidden></p>
      </div>
      <div class="rec-panel" id="recPanel" hidden>
        <div class="rec-ring"><div><div class="rec-time" id="recTime">0:00</div><div class="rec-label">듣고 있어요</div></div></div>
        <button class="stop" id="stopBtn" type="button"><i></i>다 했어요</button>
      </div>
      <div class="clip" id="clipPanel" hidden>
        <div class="clip-title" id="clipTitle">목소리가 담겼어요</div>
        <audio id="clipAudio" controls preload="metadata"></audio>
        <div class="clip-actions">
          <button class="small" id="reRecBtn" type="button">다시 녹음</button>
          <button class="small" id="dropClipBtn" type="button">목소리 지우기</button>
        </div>
      </div>
      <input type="file" id="audioFile" accept="audio/*" hidden>
    </div>
    </div>

    <div id="panelText" role="tabpanel" hidden>
      <textarea id="bodyInput" aria-label="오늘의 일기" placeholder="생각나는 대로 편하게 적어 주세요. 키보드의 마이크를 눌러 말해도 글로 적혀요."></textarea>
    </div>

    <div class="stickers">
      <div class="st-row"><span class="label">날씨</span><div class="chips" id="weatherChips"></div></div>
      <div class="st-row"><span class="label">기분</span><div class="chips" id="moodChips"></div></div>
    </div>

    <div class="actions">
      <button class="btn" id="saveBtn" type="button">일기 저장하기</button>
      <button class="btn ghost" id="cancelBtn" type="button" hidden>고치기 취소</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>

  <!-- 가족: 비밀번호 -->
  <section class="page pin" id="pinBox" hidden aria-label="가족 비밀번호">
    <p class="sec-title">엄마의 일기장, 펼쳐 볼까요?</p>
    <p class="pin-hint">내 비밀번호 네 자리를 넣어 주세요</p>
    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-label="비밀번호">
    <button class="btn" id="pinBtn" type="button">일기장 펼치기</button>
    <div class="toast" id="pinToast" role="status" aria-live="polite"></div>
  </section>

  <section id="listSec" hidden aria-label="일기 목록">
    <div class="sec-head"><p class="sec-title" id="listTitle">지난 일기</p><span><button class="link me-link" id="meBtn" type="button" hidden></button> <button class="link" id="refreshBtn" type="button">새로고침</button></span></div>
    <div class="notice" id="feedNotice">엄마의 하루를 펼치는 중이에요…</div>
    <div class="feed" id="feed"></div>

<script>

function canRecordHere(){

         : n==='NotFoundError' ? '이 기기에서 마이크를 찾지 못했어요.' : '녹음을 시작하지 못했어요. 다시 눌러 주세요.');
  });
}
/* 폰에서 녹음한 webm은 길이 정보가 없어 재생 막대가 0:00으로 보임 → 끝으로 한 번 넘겨 길이를 알아낸 뒤 처음으로 */
function fixDuration(a,done){
  var fin=function(){ if(done){ var d=done; done=null; d(); } };
  a.addEventListener('loadedmetadata',function(){
    if(isFinite(a.duration)&&a.duration>0) return fin();
    var h=function(){ if(isFinite(a.duration)&&a.duration>0){ a.removeEventListener('durationchange',h); a.currentTime=0; fin(); } };
    a.addEventListener('durationchange',h); a.currentTime=1e7;
  },{once:true});
  setTimeout(fin,4000);
}
/* 녹음 중에는 화면이 꺼지지 않게. 다른 앱으로 넘어가면 거기까지 녹음된 걸 지켜 둠 */

});
function micMsg(t){ var m=$('micMsg'); m.textContent=t||''; m.hidden=!t; }

function setClip(blob,mime,name,seconds){
  if(!blob||!blob.size){ toast('toast','소리가 담기지 않았어요. 다시 눌러 주세요.','err'); showVoice('idle'); return; }

function blobToBase64(blob){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result).split(',')[1]||''); }; r.onerror=rej; r.readAsDataURL(blob); }); }

/* ---------- 엄마: 쓰기 ---------- */
function chips(boxId,list,key){
  var box=$(boxId); box.innerHTML='';
  list.forEach(function(v){
    var b=document.createElement('button'); b.type='button'; b.className='chip';

function setMode(m){

function save(){

  if(!text&&!clip&&!keptAudio){ toast('toast', $('panelVoice').hidden?'일기 내용을 적어 주세요.':'먼저 동그란 버튼을 눌러 목소리를 남겨 주세요.','err'); return; }

      .withSuccessHandler(function(){

        toast('toast', wasEdit?'고친 일기를 저장했어요.':'오늘 하루, 잘 담아 두었어요. 동탁이랑 동학이가 읽을 거예요.','ok'); loadList();
      })

      .catch(function(){ btn.disabled=false; btn.textContent='일기 저장하기'; toast('toast','목소리를 읽지 못했어요. 다시 녹음해 주세요.','err'); });

function startEdit(e){

/* ---------- 목록 ---------- */
function loadList(){
  $('feedNotice').hidden=false; $('feedNotice').textContent='엄마의 하루를 펼치는 중이에요…';
  var fail=function(err){
    if(String(err&&err.message).indexOf('권한')>=0){ logout(); toast('pinToast','비밀번호가 바뀌었어요. 다시 넣어 주세요.','err'); return; }
    $('feedNotice').textContent='일기를 불러오지 못했어요. 새로고침을 눌러 주세요.'; };
  if(MODE==='mom'){
    google.script.run.withSuccessHandler(function(list){ entries=list||[]; render(); showNews(); }).withFailureHandler(fail).getRecent();
  }else{
    google.script.run.withSuccessHandler(function(res){
      if(!res||!res.ok){ logout(); toast('pinToast','비밀번호가 바뀌었어요. 다시 넣어 주세요.','err'); return; }
      if(res.who&&res.who!==ME){ ME=res.who; store('who',ME); if(ME==='엄마'){ start(); return; } }
      entries=res.entries; render(); markAllRead();
    }).withFailureHandler(fail).getAllForFamily(pin);

}
function el(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
var PLAY_SVG='<span class="pbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" fill="currentColor"/></svg></span>';
function playButton(e){
  var b=el('button','play'); b.type='button'; b.innerHTML=PLAY_SVG; b.appendChild(el('span',null,'엄마 목소리로 듣기'));
  b.onclick=function(){
    var show=function(url){ var a=document.createElement('audio'); a.controls=true; a.preload='metadata'; b.replaceWith(a); fixDuration(a,function(){ a.play().catch(function(){}); }); a.src=url; };
    if(audioCache[e.id]){ show(audioCache[e.id]); return; }
    b.disabled=true; b.lastChild.textContent='불러오는 중…';
    google.script.run.withSuccessHandler(function(r){
      var bin=atob(r.data), arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);

    }).withFailureHandler(function(){ b.disabled=false; b.lastChild.textContent='다시 눌러 주세요'; }).getAudio(e.id, pin);
  };
  return b;
}
function render(){
  var feed=$('feed'); feed.innerHTML='';
  if(!entries.length){ $('feedNotice').hidden=false; $('feedNotice').textContent= MODE==='mom'?'첫 번째 하루를 기다리고 있어요.':'엄마의 첫 편지를 기다리고 있어요.'; return; }
  $('feedNotice').hidden=true;
  var lastMonth='';
  entries.forEach(function(e){
    var p=parts(e.date);
    if(MODE==='family'){ var mk=p.y+'년 '+p.m+'월'; if(mk!==lastMonth){ feed.appendChild(el('div','month',mk)); lastMonth=mk; } }

    var dd=el('span','e-date'); dd.appendChild(el('b',null,p.m+'월 '+p.w+'요일')); dd.appendChild(el('span',null,[e.weather,e.mood].filter(Boolean).join(' · ')||' ')); head.appendChild(dd);

/* ---------- 아들들의 읽음 · 반응 · 답장 ---------- */
function socialBlock(e){
  e.reads=e.reads||{}; e.reacts=e.reacts||{}; e.replies=e.replies||[];
  var box=el('div','social');
  var reads=el('div','reads');

    var f=el('form','reply-form'); var inp=document.createElement('input'); inp.id='reply-'+e.id; inp.maxLength=300; inp.placeholder='엄마에게 한마디 (짧아도 돼요)'; inp.setAttribute('aria-label','엄마에게 한마디');

function sendReact(e,emoji){

  }).react(pin,ME,e.id,emoji);

    .reply(pin,ME,e.id,t);

function alertBox(msg){ var n=$('news'); n.innerHTML=''; n.appendChild(el('span',null,msg)); n.hidden=false; }
function markAllRead(){
  if(!ME) return;
  var ids=entries.filter(function(e){ return !(e.reads&&e.reads[ME]); }).map(function(e){ return e.id; });

}
function showNews(){
  var seen=load('seen')||'', ev=[];

    (e.replies||[]).forEach(function(r){ ev.push({t:r.time,s:r.who+'이가 답장을 남겼어요 💌 “'+(r.text.length>24?r.text.slice(0,24)+'…':r.text)+'”'}); });
    Object.keys(e.reacts||{}).forEach(function(n){ var r=e.reacts[n]; ev.push({t:r.time,s:n+'이가 '+r.emoji+' 를 보냈어요'}); });
    Object.keys(e.reads||{}).forEach(function(n){ ev.push({t:e.reads[n],s:n+'이가 일기를 읽었어요',low:1}); });
  });
  var fresh=ev.filter(function(x){ return x.t&&x.t>seen; }).sort(function(a,b){ return (a.low||0)-(b.low||0)||(a.t<b.t?1:-1); });
  var n=$('news'); n.innerHTML='';
  if(!fresh.length){ n.hidden=true; return; }
  n.appendChild(el('b',null,'아들들이 엄마 일기를 봤어요'));
  fresh.slice(0,3).forEach(function(x){ n.appendChild(el('span',null,x.s)); });
  n.hidden=false;
  store('seen', ev.reduce(function(m,x){ return x.t>m?x.t:m; },seen));
}
function hideAll(){ ['pinBox','composer','listSec','news'].forEach(function(id){ $(id).hidden=true; }); }
function logout(){ store('pin'); store('who'); pin=''; ME=''; showPin(); }
function start(){
  hideAll(); MODE= ME==='엄마'?'mom':'family'; confirmId=null;
  $('listSec').hidden=false; $('meBtn').textContent='나는 '+ME+' · 바꾸기'; $('meBtn').hidden=false;
  if(MODE==='mom'){
    $('subtitle').textContent='동탁이, 동학이에게 남기는 엄마의 하루'; $('listTitle').textContent='엄마가 남긴 하루들';
    $('composer').hidden=false; initMom();
  }else{
    $('subtitle').textContent=ME+'이에게, 엄마가 보낸 편지'; $('listTitle').textContent='엄마가 보낸 편지';
  }
  loadList();
}
var momReady=false;
function initMom(){
  if(momReady) return; momReady=true;
  $('dateInput').value=todayStr(); loadDraft(); refreshChips(); setDateLabel(); showVoice('idle');
  $('dateInput').onchange=setDateLabel; $('bodyInput').oninput=saveDraft;
  $('tabVoice').onclick=function(){ setMode('voice'); }; $('tabText').onclick=function(){ setMode('text'); };
  var d0=null; try{ d0=JSON.parse(load('draft')||'null'); }catch(e){}
  setMode(d0&&d0.t ? 'text' : (load('mode')||'voice'));
  $('micBtn').onclick=startRecording; $('stopBtn').onclick=stopRecording;
  $('reRecBtn').onclick=function(){ dropClip(); startRecording(); };
  $('dropClipBtn').onclick=dropClip;
  $('audioFile').onchange=function(){ var f=this.files&&this.files[0]; if(f) setClip(f,f.type,f.name,0); this.value=''; };
  $('saveBtn').onclick=save; $('cancelBtn').onclick=function(){ resetComposer(); loadDraft(); refreshChips(); };
}

/* ---------- 가족: 비밀번호 ---------- */
function showPin(msg){ hideAll(); $('subtitle').textContent='엄마와 동탁이, 동학이의 일기장'; $('pinBox').hidden=false; if(msg) toast('pinToast',msg,'err'); $('pinInput').focus(); }
function tryPin(){
  var v=$('pinInput').value.trim(); if(!v) return;
  var btn=$('pinBtn'); btn.disabled=true;
  google.script.run.withSuccessHandler(function(res){
    btn.disabled=false;
    if(!res||!res.ok){ toast('pinToast','비밀번호가 맞지 않아요.','err'); return; }
    pin=v; store('pin',v); ME=res.who||''; store('who',ME); $('pinInput').value=''; start();
  }).withFailureHandler(function(){ btn.disabled=false; toast('pinToast','연결이 안 돼요. 다시 눌러 주세요.','err'); }).getAllForFamily(v);
}

/* ---------- 시작: 모두 같은 링크 → 각자 비밀번호 (비밀번호로 누구인지 알아봄) ---------- */
(function(){
  $('refreshBtn').onclick=loadList;
  $('meBtn').onclick=logout;
  $('pinBtn').onclick=tryPin; $('pinInput').onkeydown=function(ev){ if(ev.key==='Enter') tryPin(); };
  var saved=load('pin');
  if(saved&&ME){ pin=saved; start(); } else logout();
})();
</script>
